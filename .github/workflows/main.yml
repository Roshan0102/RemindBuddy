name: Build and Deploy

on:
  push:
    branches: [ master, main ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Enable Gradle caching (saves ~5-8 mins)
      - uses: gradle/actions/setup-gradle@v3
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true # Caches Flutter SDK & pub packages

      - name: Create placeholder .env
        working-directory: ./frontend
        run: echo "GEMINI_API_KEY=dummy_key" > .env
        
      - name: Get Dependencies
        working-directory: ./frontend
        run: flutter pub get
        
      - name: Build Standard APK
        working-directory: ./frontend
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemindBuddy-v1.8.5-APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        if: secrets.FIREBASE_SERVICE_ACCOUNT_KEY != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Overwrite Latest APK in Firebase Storage
        if: secrets.FIREBASE_SERVICE_ACCOUNT_KEY != ''
        run: |
          gcloud storage cp frontend/build/app/outputs/flutter-apk/app-release.apk gs://remindbuddy-b68f9.firebasestorage.app/releases/latest-release.apk

      - name: Extract version from pubspec.yaml
        id: get_version
        working-directory: ./frontend
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
